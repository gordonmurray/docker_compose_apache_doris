name: trying-apache-doris

services:
  fe:
    image: apache/doris:fe-${DORIS_VERSION:-4.0.8}
    hostname: fe
    entrypoint: [bash, /demo/scripts/start-doris.sh, fe]
    environment:
      FE_SERVERS: fe1:${DORIS_NETWORK_PREFIX:-172.20.80}.2:9010
      FE_ID: "1"
      DORIS_JAVA_HEAP: 2g
    # Keep Kafka available until Doris has stopped, so Routine Load is not paused
    # by a broker disappearing during a normal shutdown.
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DORIS_HTTP_PORT:-8030}:8030"
      - "127.0.0.1:${DORIS_SQL_PORT:-9030}:9030"
    volumes:
      - fe-meta:/opt/apache-doris/fe/doris-meta
      - fe-log:/opt/apache-doris/fe/log
      - ./fe/conf/fe.conf:/demo/fe.conf:ro
      - ./scripts:/demo/scripts:ro
    networks:
      default:
        ipv4_address: ${DORIS_NETWORK_PREFIX:-172.20.80}.2
    healthcheck:
      # SHOW is served by the frontend before a backend has registered.
      test: [CMD, mysql, --protocol=TCP, -h127.0.0.1, -P9030, -uroot, --connect-timeout=5, -e, "SHOW FRONTENDS"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 3g
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    stop_grace_period: 60s

  be:
    image: apache/doris:be-${DORIS_VERSION:-4.0.8}
    hostname: be
    entrypoint: [bash, /demo/scripts/start-doris.sh, be]
    environment:
      FE_SERVERS: fe1:${DORIS_NETWORK_PREFIX:-172.20.80}.2:9010
      BE_ADDR: ${DORIS_NETWORK_PREFIX:-172.20.80}.5:9050
      DORIS_JAVA_HEAP: 512m
    depends_on:
      fe:
        condition: service_healthy
    volumes:
      - be-storage:/opt/apache-doris/be/storage
      - be-log:/opt/apache-doris/be/log
      - ./be/conf/be.conf:/demo/be.conf:ro
      - ./scripts:/demo/scripts:ro
    networks:
      default:
        ipv4_address: ${DORIS_NETWORK_PREFIX:-172.20.80}.5
    healthcheck:
      test: [CMD, bash, /demo/scripts/check-backend.sh]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    mem_limit: 3g
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    stop_grace_period: 60s

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.1.2}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      default:
        ipv4_address: ${DORIS_NETWORK_PREFIX:-172.20.80}.8
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    mem_limit: 1g
    stop_grace_period: 30s

networks:
  default:
    ipam:
      config:
        - subnet: ${DORIS_NETWORK_PREFIX:-172.20.80}.0/24

volumes:
  fe-meta:
  fe-log:
  be-storage:
  be-log:
  kafka-data:
